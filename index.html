<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://emmlaxobthlzocqdgdcn.supabase.co; base-uri 'none'; form-action 'none'">
<title>Sipariş formu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="sayfa">
    <header class="top">
      <h1 class="brand" id="firma">Sipariş formu</h1>
    </header>
    <main>
      <label class="field">
        <span class="field-label">Adınız / işletme adınız *</span>
        <input id="ad" type="text" name="name" autocomplete="name" autocapitalize="words" maxlength="60" required>
      </label>
      <p class="uyari" id="ad-uyari" hidden></p>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M15.2 15.2L20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <input id="ara" type="text" autocomplete="off" enterkeyhint="search" placeholder="Ürün ara" aria-label="Ürün ara">
      </div>
      <p class="banner" id="guncelleme" hidden>Ürün listesi güncellendi, seçimlerinizi kontrol edin</p>
      <div class="catalog" id="katalog"></div>
      <p class="empty" id="bos" hidden>Eşleşen ürün yok.</p>
      <div class="note">
        <label class="check">
          <input id="not-ekle" type="checkbox">
          <span>Not ekle (isteğe bağlı)</span>
        </label>
        <div class="note-box" id="not-alani" hidden>
          <label class="field">
            <span class="field-label">Sipariş notu</span>
            <textarea id="not" rows="3" maxlength="200"></textarea>
          </label>
          <p class="hint">En fazla 25 kelime ve 200 karakter.</p>
        </div>
      </div>
      <p class="fine">Yazdığınız ad ve siparişiniz yalnızca bu işletmeye iletilir. <a class="text-link" href="gizlilik.html">Ayrıntı</a></p>
      <div class="hp" aria-hidden="true">
        <label>Web sitesi<input id="hp" type="text" tabindex="-1" autocomplete="off"></label>
      </div>
    </main>
  </div>
  <div class="bar" id="cubuk">
    <p class="bar-count" id="bar-metin">0 ürün · 0 adet</p>
    <button type="button" id="gonder" disabled>Gönder</button>
  </div>
  <div class="app status-screen" id="durum" hidden>
    <h1 class="brand" id="durum-ad" hidden></h1>
    <p class="status-text" id="durum-metin"></p>
  </div>
  <div class="app status-screen" id="basari" hidden>
    <p class="status-text">Siparişiniz iletildi. İşletme onayladığında sizinle iletişime geçecek.</p>
    <button type="button" id="yeni-siparis">Yeni sipariş</button>
  </div>
  <div class="backdrop" id="perde" hidden></div>
  <div class="sheet" id="ozet" role="dialog" aria-modal="true" aria-labelledby="ozet-baslik" tabindex="-1" hidden>
    <div class="grab" aria-hidden="true"></div>
    <h2 id="ozet-baslik">Sipariş özeti</h2>
    <p class="ozet-ad" id="ozet-ad"></p>
    <p class="uyari" id="ozet-uyari" hidden></p>
    <ul class="lines" id="ozet-kalemler"></ul>
    <div class="sheet-actions">
      <button type="button" id="siparisi-gonder">Siparişi gönder</button>
      <button type="button" id="duzenle">Düzenle</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
